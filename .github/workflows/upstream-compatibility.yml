name: upstream-compatibility

on:
  pull_request:
    branches: ["victory/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    name: Upstream merge report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Compare the fork with the latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/victory/check_upstream.py --fetch
