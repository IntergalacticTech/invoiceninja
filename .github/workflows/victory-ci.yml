# Checks for the VictoryCTO fork on every push: the team app (lint, tests, build)
# and the server tests for the fork's own changes (SSO-only, financial hiding,
# /victory/* endpoints). Upstream's full phpunit matrix stays on v5-stable.
name: victory-ci

on:
  push:
    branches:
      - "victory/**"
      - "claude/**"
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - "victory/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: victory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  team-app:
    name: Team app (victory-ui)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: victory-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: victory-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  server:
    name: Server (fork tests)
    runs-on: ubuntu-24.04
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ninja
      DB_USERNAME: root
      DB_PASSWORD: ninja
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      MAIL_MAILER: log
      PDF_GENERATOR: simulator
      MULTI_DB_ENABLED: false
      SENTRY_SAMPLE_RATE: 0
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ninja
          MYSQL_DATABASE: ninja
        options: --health-cmd="mariadb-admin ping -pninja" --health-interval=5s --health-timeout=2s --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysql, mysqlnd, sqlite3, bcmath, gmp, gd, curl, zip, openssl, mbstring, xml, intl
          tools: composer:v2

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.3-composer-

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("GH_TOKEN")]]);')"
          composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the application
        run: |
          # .env values win over the job environment, so pin the ones that differ from upstream's CI.
          cp .env.ci .env
          sed -i -E 's/^(DB_PORT1?)=.*/\1=3306/; s/^DB_USERNAME=.*/DB_USERNAME=root/; s/^DB_PASSWORD=.*/DB_PASSWORD=ninja/; s/^CACHE_DRIVER=.*/CACHE_DRIVER=file/; s/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/; s/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          grep -E '^(DB_|CACHE_DRIVER|QUEUE_CONNECTION|SESSION_DRIVER)' .env
          php artisan key:generate
          php artisan config:clear
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run the fork's tests
        run: |
          vendor/bin/phpunit --no-coverage \
            tests/Feature/Auth/OidcOnlyTest.php \
            tests/Feature/FinancialVisibilityTest.php \
            tests/Feature/Victory/VictoryEndpointsTest.php
