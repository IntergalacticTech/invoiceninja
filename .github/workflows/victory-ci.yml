# Deliberate production candidates only. Drafts and unlabelled PRs use no runners.
name: victory-ci

on:
  pull_request:
    branches: [victory/team-app]
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled, converted_to_draft, edited]

permissions:
  contents: read

concurrency:
  # Unrelated label/title edits must not cancel an eligible candidate's checks.
  group: victory-ci-${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.action != 'edited' || github.event.label.name == 'deployment' || github.event.changes.base != null) && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  policy:
    name: Deployment policy
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deployment') &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' && github.event.action != 'edited' ||
       github.event.label.name == 'deployment' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - run: python3 -m unittest discover -s tools/victory -p 'test_*.py'

  team-app:
    name: Team app (victory-ui)
    needs: policy
    timeout-minutes: 15
    env:
      VITE_MUI_X_LICENSE_KEY: ${{ secrets.MUI_X_LICENSE_KEY }}
      MUI_X_TELEMETRY_DISABLED: "1"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: victory-ui
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Require the configured MUI Pro license
        run: test -n "$VITE_MUI_X_LICENSE_KEY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: victory-ui/package-lock.json
      - run: npm ci
      - name: Verify shared project screen package matches the standalone source
        run: python3 ../tools/victory/build_shared_workspace.py --check
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  server:
    name: Server (fork tests)
    needs: policy
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ninja
      DB_USERNAME: root
      DB_PASSWORD: ninja
      CACHE_DRIVER: file
      # A real queue, as in production and upstream's CI: with the sync driver, queued listeners run
      # inline and the Queue::before hook in AppServiceProvider resets TruthSource mid-request,
      # which makes the OIDC sign-in test lose its company token.
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SESSION_DRIVER: file
      MAIL_MAILER: log
      PDF_GENERATOR: simulator
      MULTI_DB_ENABLED: false
      SENTRY_SAMPLE_RATE: 0
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ninja
          MYSQL_DATABASE: ninja
        options: --health-cmd="mariadb-admin ping -pninja" --health-interval=5s --health-timeout=2s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysql, mysqlnd, sqlite3, bcmath, gmp, gd, curl, zip, openssl, mbstring, xml, intl, redis
          tools: composer:v2

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.3-composer-

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMPOSER_AUTH="$(php -r 'echo json_encode(["github-oauth" => ["github.com" => getenv("GH_TOKEN")]]);')"
          export COMPOSER_AUTH
          composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the application
        run: |
          # .env values win over the job environment, so pin the ones that differ from upstream's CI.
          cp .env.ci .env
          sed -i -E 's/^(DB_PORT1?)=.*/\1=3306/; s/^DB_USERNAME=.*/DB_USERNAME=root/; s/^DB_PASSWORD=.*/DB_PASSWORD=ninja/; s/^CACHE_DRIVER=.*/CACHE_DRIVER=file/; s/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=redis/; s/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          grep -E '^(DB_|CACHE_DRIVER|QUEUE_CONNECTION|SESSION_DRIVER|REDIS)' .env
          php artisan key:generate
          php artisan config:clear
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run the fork's tests
        run: |
          vendor/bin/phpunit --no-coverage \
            tests/Feature/Auth/OidcOnlyTest.php \
            tests/Feature/FinancialVisibilityTest.php \
            tests/Feature/Victory

      - name: Record the tested deployment candidate
        run: python3 tools/victory/release_candidate.py record "$RUNNER_TEMP/deployment-candidate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-candidate
          path: ${{ runner.temp }}/deployment-candidate.json
          retention-days: 14

  upstream:
    name: Upstream compatibility
    needs: policy
    uses: ./.github/workflows/upstream-compatibility.yml
